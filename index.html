<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GDF Preventivi">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Preventivatore GruppoDiFazio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#setup{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#f3f4f6;padding:24px}
#setup .card{width:min(560px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 20px 55px rgba(0,0,0,.14)}
#setup p{color:#64748b;line-height:1.5}
#installBar{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;gap:12px;background:#111827;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
#installBar small{display:block;color:#cbd5e1;margin-top:2px}#installBar button{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:900}
#iosHelp{position:fixed;z-index:40;inset:0;background:rgba(15,23,42,.68);display:none;place-items:end center;padding:20px}
#iosHelp .sheet{width:min(540px,100%);background:#fff;border-radius:20px;padding:22px;color:#111827}
#iosHelp button{width:100%;border:0;border-radius:10px;padding:12px;background:#e5e7eb;font-weight:800;margin-top:12px}
@media(display-mode:standalone){#installBar{display:none!important}}
</style>
</head>
<body>
<iframe id="app" title="Preventivatore GruppoDiFazio" allow="clipboard-read; clipboard-write"></iframe>
<div id="setup"><div class="card"><h1>Configura la PWA</h1><p>Nel file <b>config.js</b> inserisci l'URL <b>/exec</b> della Web App Google Apps Script.</p></div></div>
<div id="installBar"><div><strong>Installa GDF Preventivi</strong><small>Aprila come un'app, senza barra del browser.</small></div><button id="installBtn">Installa</button></div>
<div id="iosHelp"><div class="sheet"><h2>Aggiungi alla schermata Home</h2><p>Su iPhone/iPad usa <b>Condividi</b> e scegli <b>Aggiungi alla schermata Home</b>.</p><button onclick="document.getElementById('iosHelp').style.display='none'">Chiudi</button></div></div>
<script src="./config.js"></script>
<script>
const cfg=window.GDF_PWA_CONFIG||{}, url=String(cfg.appUrl||"").trim(), setup=document.getElementById("setup"), app=document.getElementById("app");
if(!url||url.includes("INCOLLA_QUI")) setup.style.display="grid"; else app.src=url;
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
let deferredPrompt=null; const installBar=document.getElementById("installBar"), installBtn=document.getElementById("installBtn");
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true, isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(!standalone&&isIOS){installBar.style.display="flex";installBtn.textContent="Come fare";installBtn.onclick=()=>document.getElementById("iosHelp").style.display="grid";}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!standalone)installBar.style.display="flex";});
installBtn.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBar.style.display="none";});
addEventListener("appinstalled",()=>{installBar.style.display="none";deferredPrompt=null;});
</script>
</body></html>
